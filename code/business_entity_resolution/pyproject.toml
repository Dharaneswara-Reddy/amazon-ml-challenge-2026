[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ber"
version = "0.1.0"
description = "Business entity resolution pipeline for the Amazon ML Challenge 2026"
requires-python = ">=3.11,<3.12"

[project.scripts]
ber = "ber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]
